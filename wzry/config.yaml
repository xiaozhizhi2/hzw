# 王者荣耀 · AutoJS + PC 桥接（推荐）
#
# PC:  python run_bridge.py
# 手机: AutoX 运行 autox/wzry_play_bridge.js（改 PC_HOST）
#
# 纯手机（较慢）: autox/wzry_play.js

bridge:
  host: 0.0.0.0
  port: 9330
  pc_host: null
  move_hold_ms: 800
  log_every: 8
  save_uploads: false
  save_dir: debug_uploads
  save_every: 10
  save_max: 500

follow:
  # 要紧跟的队友名字（必填，支持多个）
  # 格式1: teammate_names: ["队友1", "队友2", "队友3"]
  # 格式2: teammate_names: "队友1,队友2,队友3"
  teammate_names: ["泥石流", "怎么说", "花球", "小青龙", "五里", "倾雨", "吃火锅"]
  field_crop: [0.08, 0.78, 0.02, 0.98]
  ocr_min_score: 0.4
  name_below_offset: 48
  player_x_ratio: 0.5
  player_y_ratio: 0.55
  follow_max_dist_ratio: 0.5
  follow_close_dist: 80
  sticky_ms: 5000

rules:
  skill1_interval_sec: 1.0
  low_hp_ratio: 0.5
  red_bar_pixels: 120
  field_crop: [0.10, 0.78, 0.12, 0.88]
  own_hp_crop: [0.84, 0.98, 0.01, 0.28]

match:
  kda_crop: [0.03, 0.12, 0.38, 0.62]
  result_crop: [0.28, 0.52, 0.32, 0.68]
