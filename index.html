<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>星梦抓娃娃</title>
<style>
:root{--ink:#332947;--pink:#ff6fae;--pink2:#ff9ac7;--cream:#fff9ee;--yellow:#ffd66b;--mint:#7de0d0;--purple:#8d79e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 20%,#fff 0 3%,transparent 4%),radial-gradient(circle at 85% 12%,#fff6 0 2%,transparent 3%),linear-gradient(145deg,#8ad8ef,#bca9f5 45%,#ffb4d1);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:24px 24px;opacity:.45}
.app{width:min(1040px,100%);display:grid;grid-template-columns:minmax(340px,680px) minmax(230px,300px);gap:18px;position:relative}
.machine,.panel{background:#fff9;border:3px solid #fff;border-radius:30px;box-shadow:0 22px 55px #4c397344,inset 0 0 0 2px #ffffff88;backdrop-filter:blur(12px)}
.machine{padding:18px;position:relative}.marquee{height:72px;border-radius:22px 22px 14px 14px;background:linear-gradient(180deg,#ff8cbd,#ff65a7);display:flex;align-items:center;justify-content:center;color:#fff;border:4px solid #fff3;box-shadow:inset 0 -8px 0 #dd4a8d,0 8px 0 #7e5bb0;text-shadow:0 3px 0 #b63c77;position:relative;overflow:hidden}
.marquee:after{content:"★  ·  ★  ·  ★  ·  ★  ·  ★";position:absolute;bottom:3px;font-size:12px;color:#ffe081;letter-spacing:9px}.marquee h1{margin:0 0 10px;font-size:clamp(24px,4vw,40px);letter-spacing:5px}
.game-shell{margin-top:12px;padding:12px;background:linear-gradient(90deg,#7458b0,#a675cb);border-radius:14px 14px 25px 25px;box-shadow:inset 0 0 0 4px #fff4}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:9px;touch-action:none;box-shadow:inset 0 0 20px #0003}
.panel{padding:20px;display:flex;flex-direction:column;gap:15px}.panel h2{margin:0;font-size:22px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 5px 15px #5944771a}.card b{display:block;font-size:25px;color:#e64f95}.card small{color:#7d718d}
.message{min-height:76px;background:#fff7df;border:2px dashed #ffc64f;border-radius:16px;padding:12px;display:grid;place-items:center;text-align:center;font-weight:700;line-height:1.45}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{appearance:none;border:0;border-radius:15px;padding:14px 8px;font:800 16px inherit;color:#fff;cursor:pointer;box-shadow:0 6px 0 #584b87;transition:.12s transform,.12s filter;user-select:none}.btn:hover{filter:brightness(1.07)}.btn:active,.btn.active{transform:translateY(4px);box-shadow:0 2px 0 #584b87}.left,.right{background:linear-gradient(#a89af2,#7c69d7)}.grab{grid-column:1/-1;background:linear-gradient(#ff8abd,#ef4c98);box-shadow:0 6px 0 #b63372;font-size:19px}.grab:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}.reset{grid-column:1/-1;background:linear-gradient(#75dfd1,#3db8a8);box-shadow:0 6px 0 #24877c}
.help{font-size:13px;color:#746882;line-height:1.65;background:#ffffff80;padding:11px;border-radius:13px}.collection{display:flex;gap:7px;flex-wrap:wrap;min-height:44px}.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 10px #503a731f;font-size:22px;animation:pop .3s ease}.sound{position:absolute;right:29px;top:29px;border:0;background:#fff9;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:17px}@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
@media(max-width:780px){body{padding:10px;align-items:start}.app{grid-template-columns:1fr;max-width:620px}.machine{padding:10px;border-radius:20px}.panel{border-radius:20px;padding:14px}.marquee{height:59px}.game-shell{padding:8px}.controls{position:sticky;bottom:8px}.help{display:none}.sound{right:17px;top:17px}}
</style>
</head>
<body>
<main class="app">
<section class="machine">
  <div class="marquee"><h1>星梦抓娃娃</h1></div>
  <button class="sound" id="sound" title="音效">🔊</button>
  <div class="game-shell"><canvas id="game" width="800" height="600" aria-label="抓娃娃游戏区"></canvas></div>
</section>
<aside class="panel">
  <h2>🎟️ 游戏控制台</h2>
  <div class="stat"><div class="card"><small>剩余次数</small><b id="tries">10</b></div><div class="card"><small>成功抓到</small><b id="score">0</b></div></div>
  <div class="message" id="message">移动爪子，对准娃娃后按下抓取！</div>
  <div class="controls">
    <button class="btn left" data-dir="-1">◀ 向左</button><button class="btn right" data-dir="1">向右 ▶</button>
    <button class="btn grab" id="grab">🕹️ 放下爪子</button><button class="btn reset" id="reset">↻ 重新开局</button>
  </div>
  <div><b>我的收藏</b><div class="collection" id="collection"></div></div>
  <div class="help">电脑：← → 或 A D 移动，空格抓取。<br>手机：长按方向按钮移动。每局 10 次，靠近娃娃中心更容易抓中。</div>
</aside>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={tries:document.getElementById('tries'),score:document.getElementById('score'),msg:document.getElementById('message'),grab:document.getElementById('grab'),collection:document.getElementById('collection'),sound:document.getElementById('sound')};
const W=800,H=600,FLOOR=510,items=['🧸','🐰','🐼','🦊','🐸','🐷','🐨','🐯','🦄','🐧'];
let game,raf,move=0,last=0,audioOn=true;
function newGame(){game={clawX:400,clawY:75,state:'idle',tries:10,score:0,target:null,prizes:makePrizes(),caught:[]};ui.grab.disabled=false;ui.msg.textContent='移动爪子，对准娃娃后按下抓取！';ui.collection.innerHTML='';sync();}
function makePrizes(){let a=[];for(let i=0;i<14;i++){let r=30+Math.random()*11,x=95+Math.random()*610,y=FLOOR-r-(i>7?55:0);a.push({x,y,r,emoji:items[i%items.length],won:false,rot:(Math.random()-.5)*.3})}return a.sort((p,q)=>p.y-q.y)}
function sync(){ui.tries.textContent=game.tries;ui.score.textContent=game.score;}
function tone(freq=440,dur=.08){if(!audioOn)return;let A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur)}
function grab(){if(game.state!=='idle'||game.tries<=0)return;game.tries--;game.state='down';game.target=null;ui.grab.disabled=true;ui.msg.textContent='爪子下降中…';tone(420);sync()}
function update(dt){if(game.state==='idle'){game.clawX=Math.max(75,Math.min(725,game.clawX+move*300*dt));return}if(game.state==='down'){game.clawY+=320*dt;if(game.clawY>=425){game.clawY=425;let candidates=game.prizes.filter(p=>!p.won&&Math.abs(p.x-game.clawX)<p.r*.85&&Math.abs(p.y-455)<90).sort((a,b)=>Math.abs(a.x-game.clawX)-Math.abs(b.x-game.clawX));let p=candidates[0],chance=p?Math.max(.45,.94-Math.abs(p.x-game.clawX)/70):0;if(p&&Math.random()<chance)game.target=p;game.state='up';tone(game.target?720:250,.16)}}else if(game.state==='up'){game.clawY-=260*dt;if(game.target){game.target.x=game.clawX;game.target.y=game.clawY+60}if(game.clawY<=75){game.clawY=75;if(game.target){game.target.won=true;game.score++;game.caught.push(game.target.emoji);let b=document.createElement('span');b.className='badge';b.textContent=game.target.emoji;ui.collection.appendChild(b);ui.msg.textContent=`抓到了 ${game.target.emoji}！太棒啦！`;tone(880,.25)}else ui.msg.textContent='差一点！重新瞄准再试试。';game.target=null;game.state=game.tries?'idle':'over';ui.grab.disabled=!game.tries;sync();if(!game.tries)ui.msg.textContent=game.score?`游戏结束！共抓到 ${game.score} 个娃娃 🎉`:'游戏结束，再来一局一定能抓到！'}}}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#d9f7ff');g.addColorStop(.62,'#f9e8ff');g.addColorStop(1,'#d9bde9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.22;for(let x=20;x<W;x+=58){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,40+(x%110),3,0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.fillStyle='#7351a7';ctx.fillRect(0,0,35,H);ctx.fillRect(W-35,0,35,H);ctx.fillStyle='#ad7fc8';ctx.fillRect(35,FLOOR,730,90);rounded(53,526,160,55,14,'#584276');ctx.fillStyle='#211930';ctx.fillRect(72,538,120,9);ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.fillText('PRIZE OUT',72,570);
for(let p of game.prizes){if(p.won)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.shadowColor='#60437055';ctx.shadowBlur=9;ctx.font=`${p.r*1.65}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.emoji,0,0);ctx.restore()}
ctx.strokeStyle='#51416c';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(game.clawX,0);ctx.lineTo(game.clawX,game.clawY);ctx.stroke();rounded(game.clawX-34,game.clawY-10,68,31,12,'#f4d1e6');rounded(game.clawX-26,game.clawY-5,52,18,8,'#8b79a5');ctx.strokeStyle='#58496d';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(game.clawX-18,game.clawY+14);ctx.quadraticCurveTo(game.clawX-47,game.clawY+48,game.clawX-39,game.clawY+78);ctx.moveTo(game.clawX+18,game.clawY+14);ctx.quadraticCurveTo(game.clawX+47,game.clawY+48,game.clawX+39,game.clawY+78);ctx.stroke();ctx.strokeStyle='#f3c4dc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(42,16);ctx.lineTo(42,498);ctx.moveTo(758,16);ctx.lineTo(758,498);ctx.stroke()}
function loop(t){let dt=Math.min(.03,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function setMove(v,el){move=v;document.querySelectorAll('[data-dir]').forEach(b=>b.classList.remove('active'));if(v&&el)el.classList.add('active')}
document.querySelectorAll('[data-dir]').forEach(b=>{let v=+b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setMove(v,b)});b.addEventListener('pointerup',()=>setMove(0));b.addEventListener('pointercancel',()=>setMove(0))});
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))setMove(-1);if(['ArrowRight','d','D'].includes(e.key))setMove(1);if(e.code==='Space'){e.preventDefault();grab()}});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))setMove(0)});
ui.grab.onclick=grab;document.getElementById('reset').onclick=()=>{newGame();tone(520)};ui.sound.onclick=()=>{audioOn=!audioOn;ui.sound.textContent=audioOn?'🔊':'🔇'};newGame();loop(0);
</script>
</body>
</html>
